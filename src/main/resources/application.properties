spring.application.name=erpcore

## Server properties
server.servlet.context-path=/erp/api
## 

## MySQL configurations
spring.datasource.url=jdbc:mysql://localhost:3306/erp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
##


##JPA configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##


## Logging
logging.file.name=logs/application.log
##


## jwt based authentication
app.jwt.secret=${JWT_SECRET_KEY:}
app.jwt.expiration=${JWT_EXPIRATION:}


